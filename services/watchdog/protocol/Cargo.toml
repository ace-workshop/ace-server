[package]
name = "ace-role-watchdog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
codec_ace = ["ace-codec/ace", "dep:ace-serialize", "dep:ace-serialize-derive", "ace-role-gateway/codec_ace", "ace-example-protocol/codec_ace"]

[dependencies]
ace-codec.workspace = true
ace-serialize = { workspace = true, optional = true }
ace-serialize-derive = { workspace = true, optional = true }
ace-role-gateway = { path = "../../gateway/protocol", default-features = false }
ace-example-protocol = { path = "../../../protocols/example", default-features = false }

[dev-dependencies]
sha2 = "0.10.9"
