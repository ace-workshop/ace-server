[package]
name = "ace-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
codec_ace = ["ace-server-sdk/codec_ace", "ace-role-cluster/codec_ace"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
ace-server-sdk.workspace = true
ace-role-cluster = { path = "protocol" }

[dev-dependencies]
ace-fixture-codec = { path = "../../tests/fixtures/codec", features = ["cluster"] }
