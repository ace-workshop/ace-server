[package]
name = "ace-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
codec_ace = ["ace-server-sdk/codec_ace", "ace-role-gateway/codec_ace", "ace-role-watchdog/codec_ace", "ace-example-protocol/codec_ace"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
ace-net-proto.workspace = true
ace-codec.workspace = true
ace-server-sdk.workspace = true
ace-role-gateway = { path = "protocol", default-features = false, features = ["local"] }
ace-role-watchdog = { path = "../watchdog/protocol" }
ace-example-protocol = { path = "../../protocols/example", default-features = false }
