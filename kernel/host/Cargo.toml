[package]
name = "ace-server-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ace-server-abi = { workspace = true, features = ["native"] }
abi_stable.workspace = true
serde = { version = "1", features = ["derive"] }
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
sha2 = "0.10.9"
tempfile = "3"
ace-net-proto.workspace = true
ace-transport.workspace = true
ace-server-local.workspace = true
nix = { version = "=0.32.0", default-features = false, features = ["signal"] }
crossbeam-queue = "=0.3.12"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
mio = { version = "=1.2.3", default-features = false, features = ["os-ext"] }

[dev-dependencies]
nix = { version = "=0.32.0", default-features = false, features = ["time"] }
